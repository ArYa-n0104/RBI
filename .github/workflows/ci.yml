name: TAARR data foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate gold benchmark ledger
        run: python -m taarr.dataset validate data/benchmark/benchmark.jsonl
      - name: Validate draft annotation queue
        run: python -m taarr.dataset validate data/benchmark/draft_items.jsonl
      - name: Audit source provenance and benchmark readiness
        run: python -m taarr.provenance_audit
      - name: Smoke-test experiment runner on empty gold benchmark
        env:
          TAARR_NO_VERSION_POLICY: NOT_APPLICABLE
          TAARR_MISSING_FACTS_POLICY: KLEENE
          TAARR_UNKNOWN_PRECEDENCE_POLICY: DEFINITIVE_RULES_FIRST
        run: python -m taarr.experiments --output /tmp/taarr-experiments-ci.json
      - name: Run tests
        run: pytest
      - name: Lint Python source and tests
        run: ruff check src tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
