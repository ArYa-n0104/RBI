name: TAARR data foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate gold benchmark ledger
        run: python -m taarr.dataset validate data/benchmark/benchmark.jsonl
      - name: Validate draft annotation queue
        run: python -m taarr.dataset validate data/benchmark/draft_items.jsonl
      - name: Run tests
        run: pytest
      - name: Lint Python source and tests
        run: ruff check src tests
